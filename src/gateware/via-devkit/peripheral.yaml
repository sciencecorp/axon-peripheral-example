schema_version: 1
target_profile: via-devkit
project:
  name: gateware
  description: ''
build:
  radiant_version: '2024.2'
peripherals:
- name: axon_test_source
  type: record
  fpga:
    module: axon_test_source_peripheral_top
    sources:
    # Shared with the other target profile — one copy of the peripheral RTL
    # lives at src/gateware/, each profile project references it by ../.
    - ../axon_test_source_peripheral.sv
    constraints:
      sdc: []
      pdc: []
    io: []
  api:
    msg_types:
    # Set stream parameters: payload word0 = channel_count, word1 = sample_period (clk ticks).
    - name: CONFIGURE
      value: 0x0052
      dir: host_to_fpga
      payload_bytes: 8
    # Begin streaming DATA_FRAME packets.
    - name: START_STREAM
      value: 0x0054
      dir: host_to_fpga
      payload_bytes: 0
    # Stop streaming.
    - name: STOP_STREAM
      value: 0x0055
      dir: host_to_fpga
      payload_bytes: 0
    # One frame of channel_count dummy words (free-running counter; low 16 bits are the sample).
    - name: DATA_FRAME
      value: 0x0056
      dir: fpga_to_host
      payload_bytes: variable
  verification:
    cocotb_tests:
    # Shared testbench — see the note on fpga.sources above.
    - ../test/tb/test_axon_test_source.py
    sv_tests: []
  dev_peripheral_id: 0xf001
